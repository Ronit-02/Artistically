name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artistically_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artistically_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artistically_test?schema=public
      RUN_DATABASE_TESTS: "true"
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy

      - name: Run quality gate
        run: npm run check

      - name: Verify production artifacts
        run: npm run check:artifacts
