name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artistically_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artistically_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artistically_test?schema=public
      RUN_DATABASE_TESTS: "true"
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d1b7d5eb6a850e7db884c74a55b # v4.0.3
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy

      - name: Run quality gate
        run: npm run check

      - name: Verify production artifacts
        run: npm run check:artifacts
